services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=controle-smart-dev'
      - 'POSTGRES_PASSWORD=${DATABASE_PASSWORD}'
      - 'POSTGRES_USER=${DATABASE_USERNAME}'
    ports:
      - '5435:5432'
    volumes:
      - './docker-init/init.sql:/docker-entrypoint-initdb.d/init.sql'